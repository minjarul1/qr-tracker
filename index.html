<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Technology Gopalpur</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    
    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #00E5FF 0%, #3b82f6 100%);
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      color: #fff;
    }
    
    h1 {
      color: #fff;
      font-size: 24px;
      margin-bottom: 8px;
    }
    
    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 30px;
    }
    
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
      position: relative;
      overflow: hidden;
    }
    
    .btn-facebook {
      background: linear-gradient(135deg, #1877F2 0%, #0d5bbf 100%);
      color: #fff;
    }
    
    .btn-facebook:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(24,119,242,0.4);
    }
    
    .btn-whatsapp {
      background: linear-gradient(135deg, #25D366 0%, #1da851 100%);
      color: #fff;
    }
    
    .btn-whatsapp:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(37,211,102,0.4);
    }
    
    .btn svg {
      width: 24px;
      height: 24px;
    }
    
    .tracker {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    
    .tracker-title {
      color: #94a3b8;
      font-size: 12px;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .stats {
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    
    .stat {
      text-align: center;
      padding: 15px 20px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      min-width: 80px;
    }
    
    .stat-number {
      font-size: 28px;
      font-weight: bold;
      color: #00E5FF;
    }
    
    .stat-label {
      font-size: 11px;
      color: #64748b;
      margin-top: 5px;
    }
    
    .live-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 15px;
      font-size: 11px;
      color: #64748b;
    }
    
    .live-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: blink 1.5s infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(16,185,129,0.95);
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
    }
    
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    
    .last-clicked {
      margin-top: 10px;
      font-size: 10px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">AI</div>
    <h1>AI Technology Gopalpur</h1>
    <p class="subtitle">Connect with us on social media</p>
    
    <div class="links">
      <a href="https://www.facebook.com/Aitechnologygopalpur" target="_blank" rel="noopener" class="btn btn-facebook" id="fbBtn" onclick="trackClick('facebook')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        Join Facebook Group
        <span id="fbCount" style="background:rgba(255,255,255,0.2);padding:4px 10px;border-radius:12px;font-size:13px;font-weight:bold;">0</span>
      </a>
      
      <a href="https://chat.whatsapp.com/IfD7JjeLV2u4LIQPMTORl9" target="_blank" rel="noopener" class="btn btn-whatsapp" id="waBtn" onclick="trackClick('whatsapp')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Join WhatsApp Group
        <span id="waCount" style="background:rgba(255,255,255,0.2);padding:4px 10px;border-radius:12px;font-size:13px;font-weight:bold;">0</span>
      </a>
    </div>
    
    <div class="tracker">
      <div class="tracker-title">📊 Live Click Statistics</div>
      <div class="stats">
        <div class="stat">
          <div class="stat-number" id="fbCountDisplay">0</div>
          <div class="stat-label">Facebook</div>
        </div>
        <div class="stat">
          <div class="stat-number" id="waCountDisplay">0</div>
          <div class="stat-label">WhatsApp</div>
        </div>
        <div class="stat">
          <div class="stat-number" id="totalCount">0</div>
          <div class="stat-label">Total</div>
        </div>
      </div>
      <div class="live-indicator">
        <div class="live-dot"></div>
        <span>Real-time tracking active</span>
      </div>
      <div class="last-clicked" id="lastClicked">Waiting for first click...</div>
    </div>
  </div>
  
  <div class="toast" id="toast">✓ Click recorded!</div>

  <script>
    // N8N Webhook URL for tracking
    const N8N_WEBHOOK = 'https://minjarul.dpdns.org/webhook/tracker';
    
    // Generate unique user ID
    function getUserId() {
      let uid = localStorage.getItem('visitor_id');
      if (!uid) {
        uid = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('visitor_id', uid);
      }
      return uid;
    }
    
    const userId = getUserId();
    
    // Track page view on load
    window.onload = function() {
      sendTrackingData('page_view');
      updateCounts();
    };
    
    // Track button clicks
    function trackClick(platform) {
      const sessionKey = `${platform}_${userId}`;
      if (sessionStorage.getItem(sessionKey)) {
        showToast(`You already clicked ${platform} this session!`);
        return;
      }
      sessionStorage.setItem(sessionKey, 'true');
      
      sendTrackingData('click', platform);
      updateCounts();
      
      showToast(`${platform.charAt(0).toUpperCase() + platform.slice(1)} link opened!`);
      
      const now = new Date().toLocaleTimeString();
      document.getElementById('lastClicked').textContent = `Last click: ${now} • ${platform}`;
    }
    
    // Send tracking data to n8n
    async function sendTrackingData(event, platform = null) {
      const data = {
        event: event,
        platform: platform,
        visitor_id: userId,
        timestamp: new Date().toISOString(),
        url: window.location.href,
        referrer: document.referrer || 'direct',
        user_agent: navigator.userAgent.substring(0, 200),
        screen_resolution: `${screen.width}x${screen.height}`,
        language: navigator.language,
        platform_type: navigator.platform,
        connection_type: navigator.connection ? navigator.connection.effectiveType : 'unknown'
      };
      
      try {
        await fetch(N8N_WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
          keepalive: true
        });
      } catch (e) {
        console.log('Tracking send error:', e);
      }
    }
    
    // Fetch counts from CountAPI
    async function updateCounts() {
      try {
        const [fbRes, waRes] = await Promise.all([
          fetch('https://api.countapi.xyz/get/minjarul1-social/facebook').catch(() => ({ json: () => ({ value: 0 }) })),
          fetch('https://api.countapi.xyz/get/minjarul1-social/whatsapp').catch(() => ({ json: () => ({ value: 0 }) }))
        ]);
        
        const fbData = await fbRes.json();
        const waData = await waRes.json();
        
        const fb = parseInt(fbData.value) || 0;
        const wa = parseInt(waData.value) || 0;
        const total = fb + wa;
        
        document.getElementById('fbCount').textContent = fb;
        document.getElementById('waCount').textContent = wa;
        document.getElementById('fbCountDisplay').textContent = fb;
        document.getElementById('waCountDisplay').textContent = wa;
        document.getElementById('totalCount').textContent = total;
        
      } catch (e) {
        console.log('Count fetch error:', e);
      }
    }
    
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    
    // Poll for updates every 30 seconds
    setInterval(updateCounts, 30000);
  </script>
</body>
</html>
